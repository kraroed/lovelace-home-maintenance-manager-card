name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hacs:
    name: HACS dashboard validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HACS dashboard repository
        uses: hacs/action@main
        with:
          category: plugin

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check card JavaScript syntax
        run: node --check home-maintenance-manager-card.js
      - name: Run card regression tests
        run: node --test tests/*.test.cjs
